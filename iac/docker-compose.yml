version: "3.8"

services:
  id_manager:
    image: eaglechat-id_manager:latest
    ports:
      - target: ${ID_MANAGER_PORT:-8080}
        published: ${ID_MANAGER_PORT:-8080}
        protocol: tcp
        mode: ingress
    networks:
      eaglechat_net:
        ipv4_address: ${ID_MANAGER_IP:-172.28.1.1}
    volumes:
      # Persist the user data using a named volume
      - id_manager_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          # Pin this service to a manager node to ensure it always uses
          # the same data volume. For a real HA setup, this would
          # require a distributed storage solution.
          - node.role == manager

  client:
    image: eaglechat-client:latest
    networks:
      - eaglechat_net
    depends_on:
      - id_manager
    command: ["/client"]
    stdin_open: true
    tty: true
    deploy:
      replicas: 1
      placement:
        constraints:
          # Run the client on a worker node
          - node.role == worker

networks:
  eaglechat_net:
    # Use the overlay driver for multi-host swarm networking
    driver: overlay
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  id_manager_data:
    # Define the named volume for the id_manager data
